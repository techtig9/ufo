name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Deliberately NO env vars. The product promise is that a clean clone
      # builds and serves its public pages with nothing configured, so that a
      # deployment can be created first and the keys added afterwards. Passing
      # placeholder values here would have hidden exactly the regression this
      # step exists to catch.
      - name: Build with no environment configured
        run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Advisory: a high-severity advisory in a transitive dev dependency
      # should not block a PR, but it should be visible in the run.
      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true
